<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup do King</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <!-- BIBLIOTECA DOS FOGOS DE ARTIFÍCIO -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color-1: #121212;
            --bg-color-2: #080808;
            --main-bg: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--main-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            min-height: 90vh;
            background: linear-gradient(180deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
            border: 1px solid #222222;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        /* TELA DE MENU INICIAR */
        .welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1c1c1c 0%, #050505 100%);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px;
            z-index: 10;
            text-align: center;
        }

        .welcome-screen.hidden {
            display: none !important;
        }

        .welcome-icon {
            font-size: 54px;
            margin-bottom: 20px;
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        .welcome-screen h1 {
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #ffffff 0%, #a6a6a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-start {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 18px 48px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            width: 80%;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* BOTÃO DE CONFIGURAÇÕES DE COR */
        .btn-settings {
            background: transparent;
            color: #8c8c8c;
            border: 1px solid #333333;
            padding: 10px 24px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            width: 60%;
        }

        /* PAINEL DE PALETAS DE CORES */
        .color-panel {
            display: none;
            margin-top: 15px;
            gap: 10px;
            justify-content: center;
            background: #111111;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #222222;
            width: 100%;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        /* CONTEÚDO PRINCIPAL DO APP */
        .app-content {
            display: none;
            flex-direction: column;
            width: 100%;
        }

        .app-content.visible {
            display: flex !important;
        }

        .main-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #a6a6a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* BARRA DE PROGRESSO COM BRILHO NEON */
        .progress-box {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            color: #8c8c8c;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bar-bg {
            background: #1a1a1a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            background: linear-gradient(90deg, #666666 0%, #ffffff 100%);
            height: 100%;
            width: 0%;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            transition: width 0.3s ease;
        }

        /* MENSAGEM DE PARABÉNS CORRIGIDA NA TELA */
        .congratulations {
            display: none;
            background: #ffffff;
            color: #000000;
            text-align: center;
            padding: 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
        }

        .category-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888888;
            border-bottom: 1px solid #222222;
            padding-bottom: 6px;
            margin: 25px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #1a1a1a;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #444444;
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            flex-shrink: 0;
        }

        .item.checked .checkbox {
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .checkbox::after {
            content: '✓';
            color: #000000;
            font-size: 12px;
            font-weight: 800;
            display: none;
        }

        .item.checked .checkbox::after {
            display: block;
        }

        .item-text {
            font-size: 14px;
            font-weight: 600;
            color: #cccccc;
        }

        .item.checked .item-text {
            color: #444444;
            text-decoration: line-through;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- TELA DO MENU INICIAR -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">✨🕹️</div>
        <h1>Setup do King</h1>
        <button class="btn-start" onclick="startApp()">Iniciar</button>
        <button class="btn-settings" onclick="toggleSettings()">⚙️ Configurações</button>
        
        <!-- SELETOR DE CORES -->
        <div class="color-panel" id="colorPanel">
            <div class="color-dot" style="background: #050505; border-color: #fff;" onclick="changeTheme('#121212', '#080808', '#050505')"></div>
            <div class="color-dot" style="background: #a82323;" onclick="changeTheme('#3a0d0d', '#1a0505', '#120202')"></div>
            <div class="color-dot" style="background: #23a83b;" onclick="changeTheme('#0d3a15', '#051a08', '#021204')"></div>
            <div class="color-dot" style="background: #bfaa1c;" onclick="changeTheme('#3a340d', '#1a1705', '#121002')"></div>
            <div class="color-dot" style="background: #235fa8;" onclick="changeTheme('#0d213a', '#050f1a', '#020a12')"></div>
            <div class="color-dot" style="background: #a82384;" onclick="changeTheme('#3a0d2d', '#1a0514', '#12020e')"></div>
        </div>
    </div>

    <div class="app-content" id="appContent">
        <h1 class="main-title">Setup do King ✨🕹️</h1>
